[package]
name = "fox-llm"
version = "0.1.0"
edition = "2021"
description = "A friendly interactive CLI for OpenAI and Claude"
license = "MIT"

[dependencies]
anyhow = "1"
console = "0.15"
dialoguer = "0.11"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rustyline = "17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
webbrowser = "1"

[dev-dependencies]
tempfile = "3"
