name: AI code review

on:
  pull_request_target:
    types: [opened, reopened, synchronize]

concurrency:
  group: ai-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  tests:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    cache-mode: read
    permissions:
      contents: read
    steps:
      # This job runs untrusted PR code. Never add secrets or write permissions here.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - name: Compute test cache key
        id: test_cache_key
        shell: bash
        run: echo "rust=$(rustc -Vv | sha256sum | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - name: Restore trusted test build cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/debug
          key: ${{ runner.os }}-fox-tests-${{ steps.test_cache_key.outputs.rust }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-fox-tests-${{ steps.test_cache_key.outputs.rust }}-
      - name: Run tests
        id: cargo_test
        continue-on-error: true
        shell: bash
        run: |
          set +e
          cargo test 2>&1 | tee cargo-test.log
          code=${PIPESTATUS[0]}
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit "$code"
      - name: Build bounded test report
        if: always()
        shell: bash
        env:
          TEST_OUTCOME: ${{ steps.cargo_test.outcome }}
          TEST_EXIT_CODE: ${{ steps.cargo_test.outputs.exit_code }}
        run: |
          set -euo pipefail
          if [[ -z "$TEST_EXIT_CODE" ]] || [[ ! -f cargo-test.log ]]; then
            status=infrastructure_error; code=null; infra='"cargo test не удалось достоверно запустить"'; touch cargo-test.log
          elif [[ "$TEST_EXIT_CODE" == "0" ]]; then
            status=passed; code=0; infra=null
          else
            status=failed; code="$TEST_EXIT_CODE"; infra=null
          fi
          perl -CSD -pe 's/\e\[[0-9;?]*[ -\/]*[@-~]//g; s/[^\x09\x0A\x20-\x7E\x{80}-\x{10FFFF}]//g' cargo-test.log > cargo-test.clean.log
          jq -Rn --arg status "$status" --argjson exit_code "$code" --argjson infrastructure_message "$infra" --rawfile log cargo-test.clean.log '
            {status:$status, exit_code:$exit_code,
             failed_tests: ([($log | split("\n")[]) | capture("^test (?<name>[^ ]+) \\.\\.\\. FAILED$").name?] | map(select(. != null)) | unique | .[:200]),
             log_excerpt: ($log[0:100000]), truncated: (($log | length) > 100000),
             infrastructure_message:$infrastructure_message}' > test-report.json
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-review-test-report
          path: test-report.json
          if-no-files-found: error
          retention-days: 1
      - name: Preserve failed test status
        if: always() && steps.cargo_test.outcome != 'success'
        run: exit 1

  review:
    needs: tests
    if: always() && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    cache-mode: write
    permissions:
      contents: read
      pull-requests: write
    steps:
      # The privileged job checks out only trusted base code and never executes PR files.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - name: Restore trusted reviewer build cache
        id: cargo_cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/release
          key: ${{ runner.os }}-fox-review-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-fox-review-cargo-
      - name: Compute review cache namespace
        id: cache_namespace
        shell: bash
        env:
          EMBEDDING_MODEL: ${{ vars.FOX_REVIEW_EMBEDDING_MODEL }}
          BASE_BRANCH: ${{ github.event.pull_request.base.ref }}
        run: |
          set -euo pipefail
          namespace=$(printf '%s' "v1|https://api.openai.com|${EMBEDDING_MODEL}|unicode-2000-v1" | sha256sum | cut -d' ' -f1)
          echo "prefix=${{ runner.os }}-review-rag-${BASE_BRANCH}-${namespace}" >> "$GITHUB_OUTPUT"
      - name: Restore trusted review cache
        id: review_cache
        uses: actions/cache/restore@v4
        with:
          path: .ai-review-cache/review-rag.db
          key: ${{ steps.cache_namespace.outputs.prefix }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ${{ steps.cache_namespace.outputs.prefix }}-
      - name: Record restored cache checksum
        id: cache_before
        shell: bash
        run: |
          if [[ -f .ai-review-cache/review-rag.db ]]; then
            echo "sha=$(sha256sum .ai-review-cache/review-rag.db | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          else
            echo "sha=missing" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: ai-review-test-report
          path: .ai-review-artifact
      - name: Validate test report artifact
        shell: bash
        run: |
          set -euo pipefail
          report=.ai-review-artifact/test-report.json
          if [[ ! -f "$report" ]] || [[ $(wc -c < "$report") -gt 500000 ]] || ! jq -e '
            type == "object" and
            ((keys_unsorted - ["status","exit_code","failed_tests","log_excerpt","truncated","infrastructure_message"]) | length == 0) and
            (.status == "passed" or .status == "failed" or .status == "infrastructure_error") and
            (.exit_code == null or (.exit_code | type == "number")) and
            (.failed_tests | type == "array") and (.failed_tests | length <= 200) and
            all(.failed_tests[]; type == "string" and length <= 300) and
            (.log_excerpt | type == "string") and (.log_excerpt | length <= 100000) and
            (.truncated | type == "boolean") and
            (.infrastructure_message == null or (.infrastructure_message | type == "string")) and
            (if .status == "passed" then .exit_code == 0
             elif .status == "failed" then (.exit_code | type == "number") and .exit_code != 0
             else (.infrastructure_message | type == "string") end)
          ' "$report" >/dev/null; then
            mkdir -p .ai-review-artifact
            jq -n '{status:"infrastructure_error",exit_code:null,failed_tests:[],log_excerpt:"",truncated:false,infrastructure_message:"test-report artifact отсутствует или повреждён"}' > "$report"
          fi
      - name: Build trusted reviewer
        run: cargo build --release --package fox-review --bin fox-review
      - name: Save trusted reviewer build cache
        if: steps.cargo_cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/release
          key: ${{ runner.os }}-fox-review-cargo-${{ hashFiles('Cargo.lock') }}
      - name: Generate AI review
        id: review
        env:
          GITHUB_TOKEN: ${{ github.token }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          FOX_REVIEW_PROVIDER: ${{ vars.FOX_REVIEW_PROVIDER || 'openai' }}
          FOX_REVIEW_MODEL: ${{ vars.FOX_REVIEW_MODEL }}
          FOX_REVIEW_EMBEDDING_MODEL: ${{ vars.FOX_REVIEW_EMBEDDING_MODEL }}
          FOX_REVIEW_EMBEDDING_CACHE: .ai-review-cache/review-rag.db
          FOX_REVIEW_MAX_FILES: ${{ vars.FOX_REVIEW_MAX_FILES || '50' }}
          FOX_REVIEW_MAX_DIFF_CHARS: ${{ vars.FOX_REVIEW_MAX_DIFF_CHARS || '300000' }}
          FOX_REVIEW_MAX_FILE_CHARS: ${{ vars.FOX_REVIEW_MAX_FILE_CHARS || '40000' }}
          FOX_REVIEW_BATCH_CHARS: ${{ vars.FOX_REVIEW_BATCH_CHARS || '60000' }}
          FOX_REVIEW_MAX_FINDINGS: ${{ vars.FOX_REVIEW_MAX_FINDINGS || '30' }}
        run: |
          target/release/fox-review \
            --repository '${{ github.repository }}' \
            --pull-request '${{ github.event.pull_request.number }}' \
            --test-report .ai-review-artifact/test-report.json \
            --output review.md \
            --json-output review.json
      - name: Create or update sticky review comment
        id: publish
        if: always() && steps.review.outcome == 'success'
        uses: actions/github-script@v7
        env:
          REVIEW_PATH: review.md
          REVIEW_JSON_PATH: review.json
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync(process.env.REVIEW_PATH, 'utf8');
            const reviewResult = JSON.parse(fs.readFileSync(process.env.REVIEW_JSON_PATH, 'utf8'));
            const { publishReview } = require(process.env.GITHUB_WORKSPACE + '/.github/scripts/publish-review.js');
            await publishReview({ github, context, core, body, reviewResult });
      - name: Detect updated review cache
        id: cache_after
        if: always()
        shell: bash
        env:
          BEFORE_SHA: ${{ steps.cache_before.outputs.sha }}
        run: |
          if [[ -f .ai-review-cache/review-rag.db ]]; then
            after=$(sha256sum .ai-review-cache/review-rag.db | cut -d' ' -f1)
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            after=missing
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
          if [[ "$after" != "$BEFORE_SHA" ]]; then echo "changed=true" >> "$GITHUB_OUTPUT"; else echo "changed=false" >> "$GITHUB_OUTPUT"; fi
      - name: Save trusted review cache
        if: always() && steps.cache_after.outputs.exists == 'true' && steps.cache_after.outputs.changed == 'true'
        uses: actions/cache/save@v4
        with:
          path: .ai-review-cache/review-rag.db
          key: ${{ steps.cache_namespace.outputs.prefix }}-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Report reviewer failure
        if: always() && steps.review.outcome != 'success'
        run: echo 'AI reviewer failed; an existing sticky comment was left unchanged.' >> "$GITHUB_STEP_SUMMARY"
